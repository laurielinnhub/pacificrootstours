<!doctype html><html lang="en"><meta charset="utf-8"><title>Pacific Roots layout check</title><style>body{margin:0;background:#ddd;font:14px Arial}header{position:sticky;top:0;background:#fff;padding:12px;z-index:2;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px;cursor:pointer}#stage{padding:16px;overflow:auto}iframe{display:block;border:1px solid #888;background:#fff;height:860px}</style><header><strong>Viewport:</strong><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="650">650 px</button><button data-width="768">768 px</button><button data-width="960">960 px</button><button data-width="1024">1024 px</button><button data-width="1348">1348 px</button><button data-section="top">Hero</button><button data-section="tours">Tours</button><button data-section="more">Services</button><button data-section="roberto">Roberto</button></header><div id="stage"><iframe id="sitePreview" title="Website layout preview" width="1348" src="./index.html#roberto"></iframe></div><script>const f=document.getElementById('sitePreview');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>f.width=b.dataset.width);document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>f.src='./index.html#'+b.dataset.section);</script></html>
